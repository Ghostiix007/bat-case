name: AQA Checks

on:
  push:
    branches: [ main, feature/aqa-tests ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AQA/package-lock.json

      - name: Install dependencies
        defaults:
          run:
            working-directory: AQA
        run: npm ci

      - name: Install Playwright Browsers
        defaults:
          run:
            working-directory: AQA
        run: npx playwright install --with-deps

      - name: Run Vitest API Tests
        defaults:
          run:
            working-directory: AQA
        run: npm run test:api -- --passWithNoTests

      - name: Run Playwright E2E Tests
        defaults:
          run:
            working-directory: AQA
        run: npx playwright test